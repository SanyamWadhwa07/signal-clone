# Render Blueprint for the API. The frontend deploys to Vercel (see README, "Deployment").
services:
  - type: web
    name: signal-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Enables startup safety checks (refuses to boot with the default development JWT secret).
      - key: ENVIRONMENT
        value: production
      # Signs session tokens. Render generates a random value on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Set to your Vercel URL(s), comma-separated, e.g. https://signal-clone.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # The demo database is SQLite on Render's ephemeral disk: it is re-created and re-seeded
      # on every deploy/restart, which keeps the demo data predictable.
      - key: SEED_ON_STARTUP
        value: "true"
